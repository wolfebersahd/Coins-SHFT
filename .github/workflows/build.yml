name: Build Coins Plugin

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. Set up Java 17
    - name: Set up Java 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    # 3. Build with Maven
    - name: Build with Maven
      run: mvn clean package -B

    # 4. Upload JAR artifact with commit hash in filename
    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: CoinsPlugin-${{ github.sha }}
        path: target/*.jar
