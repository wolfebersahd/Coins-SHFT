name: Build Coins Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the repo
    - name: Checkout repository
      uses: actions/checkout@v3

    # 2. Set up Java 17
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    # 3. Build the project with Maven
    - name: Build with Maven
      run: mvn clean package -B

    # 4. Save the built .jar as an artifact
    - name: Upload JAR
      uses: actions/upload-artifact@v3
      with:
        name: CoinsPlugin
        path: target/*.jar
